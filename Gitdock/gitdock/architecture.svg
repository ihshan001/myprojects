<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .bt { font-size: 15px; font-weight: 700; }
      .st { font-size: 12.5px; fill: #475569; }
      .ln { font-size: 12.5px; fill: #334155; }
      .lbl { font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <rect width="1160" height="820" fill="#f8fafc"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">GitDock — Internal Edition (you + your team, one box)</text>
  <text x="40" y="72" font-size="14" fill="#475569">Public HTTPS, allowlisted access, Cloudflare in front. The control plane orchestrates but never runs user code. Built for a team, not for strangers.</text>

  <!-- Team / access -->
  <rect x="60" y="92" width="1040" height="78" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="84" y="120" class="bt" fill="#4c1d95">TEAM ACCESS — public HTTPS + GitHub OAuth allowlist, behind Cloudflare (proxy, WAF, rate limits)</text>
  <text x="84" y="142" class="st">you (admin) · teammates (member) · designer / client (viewer)  — org + team membership check, 2FA on admin accounts, no passwords</text>
  <text x="84" y="161" class="st">private previews gated by forward-auth · signed expiring share link when a client must see one · panic switch stops everything</text>

  <line x1="580" y1="170" x2="580" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Browser -->
  <rect x="330" y="200" width="500" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Browser — Chromebook / phone / desktop</text>
  <text x="580" y="247" text-anchor="middle" font-size="12.5" fill="#64748b">drop a folder · file tree · editor · logs · PRs · live previews</text>

  <line x1="580" y1="260" x2="580" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Edge proxy -->
  <rect x="60" y="290" width="1040" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="84" y="318" class="bt" fill="#312e81">EDGE PROXY — Caddy or Traefik (public host, Cloudflare in front)</text>
  <text x="84" y="340" class="st">auto TLS · websocket upgrade · per-host routing · forward-auth gates private previews</text>
  <rect x="620" y="304" width="452" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="632" y="319" class="mono" font-size="11.5" fill="#1e293b">gitdock.example.dev      → control plane UI + API (OAuth-gated)</text>
  <rect x="620" y="330" width="452" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="632" y="345" class="mono" font-size="11.5" fill="#1e293b">8000-acme.example.dev    → website :8000 (dev env)</text>
  <rect x="620" y="356" width="452" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="632" y="371" class="mono" font-size="11.5" fill="#1e293b">3001-acme.example.dev    → admin :3001 (staging env)</text>

  <line x1="290" y1="382" x2="290" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="840" y1="382" x2="840" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Control plane -->
  <rect x="60" y="418" width="470" height="272" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="84" y="446" class="bt" fill="#155e75">CONTROL PLANE</text>
  <text x="84" y="464" font-size="11.5" fill="#0e7490">orchestrates only — never runs user code</text>
  <text x="84" y="490" class="ln">GitHub OAuth allowlist · roles (admin / member / viewer)</text>
  <text x="84" y="514" class="ln">projects · gitdock.yaml parser · runtime detection</text>
  <text x="84" y="538" class="ln">git service — one GitHub App, per-person attribution</text>
  <text x="84" y="562" class="ln">pull requests · branches · releases · version history</text>
  <text x="84" y="586" class="ln">environments: dev / staging / live + promotion gate</text>
  <text x="84" y="610" class="ln">deploy lock (one at a time) · build queue · job logs</text>
  <text x="84" y="634" class="ln">audit log + activity feed · Slack / Discord notifier</text>
  <text x="84" y="658" class="ln">env &amp; secret vault (encrypted, admin-only for live)</text>
  <text x="84" y="682" class="ln">per-user + per-project limits · global kill switch</text>

  <!-- Sandbox node -->
  <rect x="580" y="418" width="520" height="272" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="604" y="446" class="bt" fill="#9a3412">SANDBOX NODE — containment, not hostile-tenant defence</text>
  <text x="604" y="464" font-size="11.5" fill="#c2410c">Docker + cgroups (gVisor optional) · CPU / RAM / PID / disk caps per project</text>
  <rect x="604" y="480" width="472" height="24" rx="5" fill="#ffffff" stroke="#fed7aa"/>
  <text x="616" y="496" class="mono" font-size="11.5" fill="#1e293b">nginx + php-fpm 8.3     :8000   website   (private preview URL)</text>
  <rect x="604" y="510" width="472" height="24" rx="5" fill="#ffffff" stroke="#fed7aa"/>
  <text x="616" y="526" class="mono" font-size="11.5" fill="#1e293b">node server.js          :3001   admin     (private preview URL)</text>
  <rect x="604" y="540" width="472" height="24" rx="5" fill="#ffffff" stroke="#fed7aa"/>
  <text x="616" y="556" class="mono" font-size="11.5" fill="#1e293b">api                     :3002   internal only, no URL</text>
  <rect x="604" y="570" width="472" height="24" rx="5" fill="#ffffff" stroke="#fed7aa"/>
  <text x="616" y="586" class="mono" font-size="11.5" fill="#1e293b">queue worker + scheduler   supervised, restart on crash</text>
  <rect x="604" y="600" width="472" height="24" rx="5" fill="#ffffff" stroke="#fed7aa"/>
  <text x="616" y="616" class="mono" font-size="11.5" fill="#1e293b">volumes: /code · sqlite · storage   survive restarts + sleeps</text>
  <rect x="604" y="630" width="472" height="24" rx="5" fill="#fff1e6" stroke="#fdba74"/>
  <text x="616" y="646" class="mono" font-size="11.5" fill="#7c2d12">no docker.sock · cap-drop ALL · egress open, SMTP blocked</text>
  <rect x="604" y="660" width="472" height="24" rx="5" fill="#fff1e6" stroke="#fdba74"/>
  <text x="616" y="676" class="mono" font-size="11.5" fill="#7c2d12">sleep after 15 min idle → wake on first request</text>

  <line x1="532" y1="540" x2="576" y2="540" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwo)"/>
  <text x="554" y="532" text-anchor="middle" class="lbl" font-size="10">jobs</text>

  <!-- Data layer -->
  <line x1="200" y1="690" x2="200" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="840" y1="690" x2="840" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="980" y1="690" x2="980" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="60" y="718" width="330" height="94" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="82" y="744" font-size="14" font-weight="700" fill="#14532d">Postgres + Redis</text>
  <text x="82" y="766" class="ln">panel metadata · deploys · releases · audit log</text>
  <text x="82" y="786" fill="#15803d" font-size="12.5">job queue · cache · restorable</text>

  <rect x="420" y="718" width="330" height="94" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="442" y="744" font-size="14" font-weight="700" fill="#14532d">MySQL / MariaDB</text>
  <text x="442" y="766" class="ln">database + user per project, per environment</text>
  <text x="442" y="786" fill="#15803d" font-size="12.5">dev / staging / live DBs kept separate</text>

  <rect x="780" y="718" width="320" height="94" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="802" y="744" font-size="14" font-weight="700" fill="#14532d">Offsite object storage</text>
  <text x="802" y="766" class="ln">nightly DB dumps · project volumes</text>
  <text x="802" y="786" fill="#15803d" font-size="12.5">uploaded .sql · snapshot before restore</text>

  <rect x="60" y="612" width="470" height="0" fill="none"/>
</svg>
