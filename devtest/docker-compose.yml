# ============================================================================
# QueuePilot — single-host deployment
#
#   docker compose up -d --build
#   docker compose exec app php tools/migrate.php
#   docker compose exec app php tools/seed.php --plans-only
#
# This is a *default*, not a recommendation of topology. It is the smallest
# shape that satisfies the blueprint: one app container, one database, one
# worker. A clinic with 30 patients a day runs happily on this.
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      SESSION_PATH: /var/lib/php/sessions
    volumes:
      - sessions:/var/lib/php/sessions
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "php", "tools/healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Drains the notification outbox. Kept separate from the web container so a
  # slow SMS provider can never delay a patient's page load.
  worker:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
    command: ["php", "tools/queue-worker.php", "--loop", "30"]
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:30
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-queuepilot}
      MYSQL_USER: ${DB_USERNAME:-queuepilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db:
  sessions:
  logs:
